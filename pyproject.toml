[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "materialism"
version = "0.1.0"
description = "Open-source Hansen Solubility Parameter software"
requires-python = ">=3.10"
dependencies = [
    "dash>=2.17",
    "dash-bootstrap-components>=1.6",
    "plotly>=5.22",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "sqlalchemy>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
]
chem = [
    "rdkit-pypi>=2024.3",
]

[project.scripts]
materialism = "app.main:main"
